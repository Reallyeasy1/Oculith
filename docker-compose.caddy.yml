# HTTPS overlay: docker compose -f docker-compose.yml -f docker-compose.caddy.yml ...
# scripts/deploy-existing-ecs.sh adds it automatically when the env file sets LAUNCHPAD_DOMAIN.
# Pair it with PUBLIC_PORT=127.0.0.1:3000 in the env file so the app port is loopback-only
# and Caddy is the sole public entrypoint.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LAUNCHPAD_DOMAIN: ${LAUNCHPAD_DOMAIN:?set LAUNCHPAD_DOMAIN in the env file}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Persist ACME certificates across recreates to avoid Let's Encrypt rate limits.
      - ./data/caddy:/data
    depends_on:
      - launchpad
