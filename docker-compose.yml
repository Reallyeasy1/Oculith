services:
  launchpad:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${CONTAINER_RUNTIME_BASE_IMAGE:-node:22-bookworm-slim}
        DEBIAN_MIRROR: ${CONTAINER_APT_MIRROR:-}
        DEBIAN_SECURITY_MIRROR: ${CONTAINER_APT_SECURITY_MIRROR:-}
    image: volc-agent-launchpad:local
    restart: unless-stopped
    env_file:
      - ${LAUNCHPAD_ENV_FILE:-.env}
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      APP_DATA_DIR: /app/data
      AGENT_WORKSPACE_ROOT: /app/workspaces
      WORKSPACE_TEMPLATES_DIR: /app/workspace-templates
      CODEX_HOME: /app/codex-home
      CODEX_SANDBOX_MODE: ${CODEX_SANDBOX_MODE:-workspace-write}
      # Opt-in PostgreSQL backend (#191): `docker compose --profile postgres up`. Default keeps db.json + NDJSON.
      GLASSBOX_STORE: ${GLASSBOX_STORE:-json}
      DATABASE_URL: ${DATABASE_URL:-postgres://postgres:${POSTGRES_PASSWORD:-launchpad}@postgres:5432/launchpad}
    ports:
      - "${PUBLIC_PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
      - ./codex-home:/app/codex-home
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 2
    # #216: wait for PG before starting the app so `--profile postgres up` doesn't crash-loop through
    # "Cannot reach DATABASE_URL" until PG accepts connections. `required: false` keeps the default
    # profile (no postgres service enabled) valid — the dependency only binds when the profile is active.
    # Needs Compose >= 2.20.2: older Compose rejects `required` and fails `docker compose config` for
    # EVERY profile (including the default one) with an unhelpful schema error.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
  caddy:
    image: caddy:2-alpine
    # HTTPS front (#382): enable with COMPOSE_PROFILES=caddy in the env file, paired with
    # PUBLIC_PORT=127.0.0.1:3000 so Caddy is the only public entrypoint (deploy-existing-ecs.sh
    # enforces the pairing and a non-empty LAUNCHPAD_DOMAIN before starting).
    profiles: ["caddy"]
    restart: unless-stopped
    environment:
      LAUNCHPAD_DOMAIN: ${LAUNCHPAD_DOMAIN:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Named volume, deliberately NOT under ./data: keeps ACME/TLS private keys out of the
      # tree that is mounted into the agent-executing container and chown'd to uid 1000.
      # Certificates survive `down` (avoids Let's Encrypt rate limits); `down -v` deletes them.
      - caddy_data:/data
    depends_on:
      - launchpad
  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-launchpad}
      POSTGRES_DB: launchpad
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      # -h 127.0.0.1 forces TCP: during first-boot initdb the image runs a temporary server on the
      # unix socket only, so a socket probe can go green before TCP (what launchpad connects to) is up.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  caddy_data:
